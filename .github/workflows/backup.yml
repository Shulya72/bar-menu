name: Backup data

# Бэкап данных сайта: база D1 (меню, рецепты, склад, закупки, заказы, гости, отзывы)
# и фото коктейлей → R2 bar-menu-photos/backups/<дата МСК>/.
# Запуск вручную: Actions → Backup data → Run workflow.
# Репозиторий публичный: данные в лог не выводятся, только счётчики.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Install wrangler
        run: npm install --global wrangler@4.151.0 > /dev/null

      - name: Export database and copy photos
        run: |
          set -euo pipefail
          day=$(TZ=Europe/Moscow date +%F)
          dest="bar-menu-photos/backups/$day"
          wrangler d1 export bar-menu-db --remote --output db.sql > /dev/null
          wrangler r2 object put "$dest/db.sql" --remote --file db.sql --content-type application/sql > /dev/null
          # Фото, на которые ссылаются коктейли: "/api/cocktail-photo?key=cocktails%2F…" или старый вид "…/cocktails/…"
          { grep -oE 'cocktails(/|%2F)[A-Za-z0-9._-]+' db.sql || true; } | sed 's|%2F|/|' | sort -u > keys.txt
          copied=0
          while read -r key; do
            case "$key" in *.webp) type=image/webp ;; *.png) type=image/png ;; *) type=image/jpeg ;; esac
            wrangler r2 object get "bar-menu-photos/$key" --remote --file photo.bin > /dev/null
            wrangler r2 object put "$dest/$key" --remote --file photo.bin --content-type "$type" > /dev/null
            copied=$((copied + 1))
          done < keys.txt
          {
            echo "### Бэкап $day"
            echo "- база: $(grep -c '^CREATE TABLE' db.sql || true) таблиц, $(grep -c '^INSERT' db.sql || true) строк, $(du -h db.sql | cut -f1)"
            echo "- фото: $copied из $(wc -l < keys.txt)"
            echo "- где: R2 \`$dest/\`"
          } >> "$GITHUB_STEP_SUMMARY"
