name = "bar-menu"
main = "src/worker.js"
compatibility_date = "2026-10-04"

# Статика (шрифты, иконки, манифесты) раздаётся напрямую, остальное — Worker.
[assets]
directory = "./public"

[[routes]]
pattern = "shulya.party"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "bar-menu-db"
database_id = "370d49fa-99b0-4497-861e-db1a77a710a0"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "bar-menu-photos"

# Ночная уборка лишних фото коктейлей (sweepPhotos): 22:17 UTC — 01:17 по Москве.
[triggers]
crons = ["17 22 * * *"]
