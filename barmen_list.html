<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial;overflow-x:hidden;}

.top{position:fixed;top:0;left:0;width:100%;background:#000;z-index:999;padding:14px;box-sizing:border-box;border-bottom:1px solid #222;}
.title{text-align:center;font-size:22px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:20px;margin-top:2px;}

.tabs{display:flex;justify-content:space-around;margin-top:8px;border-bottom:1px solid #222;}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#777;font-size:13px;}
.tab.active{color:#7CFC00;border-bottom:2px solid #7CFC00;}

#barTop{padding-right:14px;}

.search{width:100%;padding:10px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:10px;box-sizing:border-box;}

.closeBtn{
width:100%;padding:12px;border-radius:14px;background:#7CFC00;border:none;
font-size:15px;font-weight:700;margin-top:8px;color:#000;box-sizing:border-box;
}

.wrap{max-width:720px;margin:auto;padding:14px;padding-top:260px;}

.card{border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:22px;text-align:center;background:#070707;}
.card.dim{opacity:.45;}
.name{font-size:22px;font-weight:700;margin-bottom:10px;}
.photo{width:100%;max-width:260px;margin:0 auto 14px auto;border-radius:14px;}
.ing{text-align:left;margin-top:10px;}
.miss{color:#ff4d4d;text-decoration:line-through;}
.tools{color:#7CFC00;margin-top:10px;}
.recipe{color:#aaa;margin-top:10px;font-size:14px;}

.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;}
.btn{width:42px;height:42px;font-size:20px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;}
.count{width:60px;text-align:center;font-size:18px;background:#000;border:1px solid #444;border-radius:10px;color:#fff;height:36px;}

.screen{display:none;}
.screen.active{display:block;}

.day{margin-bottom:20px;padding:14px;border:1px solid #222;border-radius:14px;background:#050505;}
.dayTitle{font-size:18px;margin-bottom:10px;color:#7CFC00;}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.row input{background:#111;border:1px solid #333;color:#fff;border-radius:6px;padding:4px;}
.total{margin-top:10px;font-weight:700;}
</style>
</head>

<body>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz69f3BJpr-lFCk_-YzE1bq_CRcXniZEvt2rD4InM_qx15XYwN6IjzI2lbTPIaI3brk/exec";
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
</script>

<div class="top">
<div class="title">Панель бармена</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>

<div class="tabs">
<button class="tab active" onclick="showScreen('bar',this)">🍸 Бар</button>
<button class="tab" onclick="showScreen('stock',this)">📦 Склад</button>
<button class="tab" onclick="showScreen('shop',this);loadShop()">🛒 Магазин</button>
<button class="tab" onclick="showScreen('stats',this);loadAccount()">📊 Учёт</button>
</div>

<div id="barTop">
<input class="search" placeholder="Поиск..." oninput="render()">
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>
</div>

<div class="wrap">

<div id="screen-bar" class="screen active">
<div id="list"></div>
</div>

<div id="screen-stock" class="screen">
<h2>Склад позже</h2>
</div>

<div id="screen-shop" class="screen">
<div class="day">
<div class="dayTitle">Магазин</div>
<div id="shopTable"></div>
<button class="closeBtn" onclick="syncShop()">Синхронизировать</button>
</div>
</div>

<div id="screen-stats" class="screen">
<div id="account"></div>
</div>

</div>

<script>
function showScreen(name,btn){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen-"+name).classList.add("active");
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");
document.getElementById("barTop").style.display = name==="bar" ? "block":"none";
}
</script>

<!-- МАГАЗИН -->
<script>
function loadShop(){

const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;

fetch(url)
.then(r=>r.text())
.then(txt=>{
const json=JSON.parse(txt.substr(47).slice(0,-2));
const rows=json.table.rows;

let html=`
<div class="row" style="font-weight:700;margin-bottom:10px">
<div style="width:25%">Ингредиент</div>
<div style="width:35%">Бренд</div>
<div style="width:15%">Объем</div>
<div style="width:15%">Цена</div>
</div>
`;

rows.forEach((r,i)=>{
const c=r.c;

const ingredient=c[12]?.v;
const brand=c[13]?.v;
const qty=c[14]?.v;
const price=c[16]?.v;

if(!ingredient) return;

html+=`
<div class="row">
<div style="width:25%">${ingredient}</div>
<input data-row="${i}" data-col="13" value="${brand||""}" style="width:35%">
<input data-row="${i}" data-col="14" value="${qty||""}" style="width:15%">
<input data-row="${i}" data-col="16" value="${price||""}" style="width:15%">
</div>
`;
});

document.getElementById("shopTable").innerHTML=html;
});
}

function syncShop(){

const inputs=document.querySelectorAll("#shopTable input");
let data=[];

inputs.forEach(i=>{
data.push({
row:i.dataset.row,
col:i.dataset.col,
value:i.value
});
});

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({shop:data})
})
.then(r=>r.text())
.then(()=>alert("Синхронизировано"));
}
</script>

<!-- остальной бар код НЕ ТРОГАЛ -->
<script>
const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const stockURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Открытый_склад`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;

let cocktails=[];
let total=0;
let sending=false;
let localStock={};

function norm(t){return String(t).replace(/\u00A0/g,"").replace(/\s+/g,"").trim().toLowerCase();}
function normNum(v){return Number(String(v).replace(/\s/g,"").replace(",",".") ) || 0;}

function loadStock(){
return fetch(stockURL)
.then(r=>r.text())
.then(txt=>{
const json=JSON.parse(txt.substr(47).slice(0,-2));
const rows=json.table.rows;
let stock={};
rows.forEach(r=>{
const c=r.c;
const name=c[0]?.v;
const qty=c[1]?.v;
if(name) stock[norm(name)]=normNum(qty);
});
return stock;
});
}

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json()),
loadStock()
]).then(([techTxt,menu,stock])=>{

localStock=JSON.parse(JSON.stringify(stock));

let photos={};
menu.forEach(r=>photos[r.Коктейль]=r.Фото);

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;

let current=null;

rows.forEach(r=>{
const c=r.c;

const id=c[0]?.v;
const name=c[1]?.v;
const cost=c[3]?.v;
const ing=c[5]?.v;
const qtyRaw=c[6]?.v;
const unit=c[7]?.v;
const avail=c[8]?.v;
const tool=c[9]?.v;
const recipe=c[10]?.v;

if(id){
current={name,cost:parseFloat(cost)||0,recipe:recipe||"",tools:[],ings:[],miss:false,photo:photos[name]||"",count:0};
cocktails.push(current);
}

if(ing){
const need=Number(qtyRaw)||0;
current.ings.push({raw:ing,need:need,unit:unit,avail:avail==1});
}

if(tool) current.tools.push(tool);
});

recalc();
render();
});

function recalc(){
cocktails.forEach(c=>{
let miss=false;
c.ings.forEach(i=>{
const left=localStock[norm(i.raw)]||0;
if(left<i.need || !i.avail) miss=true;
});
c.miss=miss;
});
}

function render(){
const search=document.querySelector(".search").value.toLowerCase();
const list=document.getElementById("list");
list.innerHTML="";
total=0;

cocktails.forEach((c,i)=>{
if(search && !c.name.toLowerCase().includes(search)) return;
total+=c.count*c.cost;

list.innerHTML+=`
<div class="card ${c.miss?'dim':''}">
<div class="name">${c.name}</div>
${c.photo?`<img src="${c.photo}" class="photo">`:""}
<div class="controls">
<button class="btn" onclick="minus(${i})">−</button>
<input class="count" value="${c.count}" readonly>
<button class="btn" onclick="plus(${i})">+</button>
</div>
</div>`;
});

document.getElementById("sum").innerText=Math.round(total);
}

function apply(i,delta){
const c=cocktails[i];
if(delta>0 && c.miss) return;

c.count+=delta;
if(c.count<0) c.count=0;
recalc();
render();
}

function plus(i){apply(i,1);}
function minus(i){apply(i,-1);}
</script>

</body>
</html>
