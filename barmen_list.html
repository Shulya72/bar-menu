<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<title>Бармен PRO</title>

<style>
*{touch-action:manipulation;}

body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
padding:0;
}

.top{
position:sticky;
top:0;
background:#000;
padding:14px;
z-index:999;
border-bottom:1px solid #222;
}

h1{
margin:0;
text-align:center;
}

#sumBox{
text-align:center;
color:#7CFC00;
font-size:22px;
margin-top:6px;
}

.search{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
border:1px solid #333;
border-radius:12px;
color:#fff;
font-size:16px;
}

#closeBtn{
width:100%;
margin-top:10px;
padding:16px;
font-size:18px;
border-radius:14px;
border:none;
background:#7CFC00;
color:#000;
font-weight:700;
}

.wrap{
max-width:720px;
margin:auto;
padding:14px;
}

.card{
border:1px solid #333;
border-radius:18px;
padding:16px;
margin-bottom:18px;
text-align:center;
transition:.2s;
}

.card.dim{
opacity:.6;
}

.name{
font-size:22px;
font-weight:700;
margin-bottom:8px;
}

.photo{
width:100%;
max-width:260px;
border-radius:14px;
margin:10px auto;
display:block;
}

.ing{
text-align:left;
margin-top:10px;
font-size:15px;
}

.miss{
text-decoration:line-through;
color:#ff4d4d;
}

.tools{
color:#7CFC00;
margin-top:8px;
font-size:14px;
}

.recipe{
color:#aaa;
font-size:14px;
margin-top:10px;
}

.counter{
margin-top:12px;
}

.counter button{
width:46px;
height:46px;
font-size:22px;
border-radius:12px;
border:none;
background:#111;
color:#fff;
}

.counter span{
margin:0 14px;
font-size:18px;
}
</style>
</head>

<body>

<div class="top">
<h1>Панель бармена PRO</h1>
<div id="sumBox">Сумма: 0 ₽</div>

<input class="search" id="search" placeholder="Поиск коктейля...">

<button id="closeBtn">Закрыть смену</button>
</div>

<div class="wrap" id="list"></div>

<script>
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw1Z5vyo_hwW5my_dFw8t49CnLVz7KZnzuPMiydht-d4SgJCVrpVKafsVqgfYGCAQ95/exec";

const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;

let cocktails=[];
let photos={};
let total=0;
let sending=false;

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json())
]).then(([techTxt,menu])=>{

menu.forEach(r=>photos[r.Коктейль]=r.Фото);

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;

let current=null;

rows.forEach(r=>{
const c=r.c;

const id=c[0]?.v;
const name=c[1]?.v;
const cost=c[3]?.v;
const ing=c[5]?.v;
const qty=c[6]?.v;
const unit=c[7]?.v;
const avail=c[8]?.v;
const tool=c[9]?.v;
const recipe=c[10]?.v;

if(id){
current={
name,
cost:parseFloat(cost)||0,
recipe:recipe||"",
tools:[],
ings:[],
miss:false,
photo:photos[name]||"",
count:0
};
cocktails.push(current);
}

if(ing){
let missing = avail==0;
if(missing) current.miss=true;

current?.ings.push({
text:`${ing} ${qty} ${unit}`,
miss:missing
});
}

if(tool) current?.tools.push(tool);

});

render();
calc();
});

function render(){
const list=document.getElementById("list");
list.innerHTML="";

let q=document.getElementById("search").value?.toLowerCase()||"";

cocktails.forEach((c,i)=>{

if(q && !c.name.toLowerCase().includes(q)) return;

list.innerHTML+=`
<div class="card ${c.miss?'dim':''}">
<div class="name">${c.name}</div>

${c.photo?`<img src="${c.photo}" class="photo">`:""}

<div class="ing">
${c.ings.map(x=>`<div class="${x.miss?'miss':''}">${x.text}</div>`).join("")}
</div>

<div class="tools">${c.tools.join(" • ")}</div>
<div class="recipe">${c.recipe}</div>

<div class="counter">
<button onclick="minus(${i})">−</button>
<span id="c${i}">${c.count}</span>
<button onclick="plus(${i})">+</button>
</div>
</div>
`;
});
}

function plus(i){
if(cocktails[i].miss) return;
cocktails[i].count++;
render();
calc();
}

function minus(i){
cocktails[i].count=Math.max(0,cocktails[i].count-1);
render();
calc();
}

function calc(){
total=0;
cocktails.forEach(c=>total+=c.cost*c.count);
total=Math.round(total);
document.getElementById("sumBox").innerText="Сумма: "+total+" ₽";
}

document.getElementById("search").oninput=render;

document.getElementById("closeBtn").onclick=async()=>{
if(sending) return;
sending=true;

const btn=document.getElementById("closeBtn");
btn.innerText="Отправка...";
btn.disabled=true;

let data=cocktails
.filter(c=>c.count>0)
.map(c=>({
name:c.name,
count:c.count,
cost:c.cost*c.count
}));

if(data.length===0){
sending=false;
btn.innerText="Закрыть смену";
btn.disabled=false;
return;
}

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
});

cocktails.forEach(c=>c.count=0);
render();
calc();

btn.innerText="Смена закрыта ✔";

setTimeout(()=>{
btn.innerText="Закрыть смену";
btn.disabled=false;
sending=false;
},2000);
};
</script>
</body>
</html>
