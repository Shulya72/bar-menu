<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial;
    margin:0;
    padding:12px;
}

h1{
    text-align:center;
    font-size:22px;
    margin:10px 0;
}

#sumBox{
    text-align:center;
    font-size:20px;
    margin-bottom:15px;
    color:#7CFC00;
}

.card{
    background:#0b0b0b;
    border:1px solid #222;
    border-radius:18px;
    padding:14px;
    margin-bottom:16px;
}

.name{
    font-size:20px;
    text-align:center;
    font-weight:700;
    margin-bottom:8px;
}

.photo{
    width:100%;
    max-width:260px;
    display:block;
    margin:0 auto 10px auto;
    border-radius:12px;
}

.ing{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    margin:2px 0;
}

.tools{
    color:#7CFC00;
    text-align:center;
    font-size:14px;
    margin-top:8px;
}

.recipe{
    color:#aaa;
    font-size:13px;
    text-align:center;
    margin-top:8px;
}

.countBox{
    text-align:center;
    margin-top:10px;
}

input{
    width:70px;
    padding:8px;
    font-size:18px;
    text-align:center;
    background:#111;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
}

button{
    width:100%;
    background:#7CFC00;
    border:none;
    padding:14px;
    font-size:18px;
    border-radius:12px;
    margin-top:14px;
}
</style>
</head>

<body>

<h1>Панель бармена PRO</h1>
<div id="sumBox">Сумма: 0 ₽</div>
<div id="list"></div>

<button onclick="sendShift()">Закрыть смену</button>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw1Z5vyo_hwW5my_dFw8t49CnLVz7KZnzuPMiydht-d4SgJCVrpVKafsVqgfYGCAQ95/exec";
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";

const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;

let cocktails=[];
let total=0;

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json())
])
.then(([techTxt,menu])=>{

let photos={};
menu.forEach(r=>photos[r.Коктейль]=r.Фото);

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;

let current=null;

rows.forEach(r=>{
const c=r.c;

const id=c[0]?.v;
const name=c[1]?.v;
const cost=c[3]?.v;
const ing=c[5]?.v;
const qty=c[6]?.v;
const unit=c[7]?.v;
const tool=c[9]?.v;
const recipe=c[10]?.v;

if(id){
current={
name,
cost:parseFloat(cost)||0,
ings:[],
tools:[],
recipe:recipe||"",
photo:photos[name]||"",
count:0
};
cocktails.push(current);
}

if(ing){
current?.ings.push(`${ing} ${qty} ${unit}`);
}

if(tool){
current?.tools.push(tool);
}

});

render();
});

function render(){
const list=document.getElementById("list");
list.innerHTML="";

cocktails.forEach((c,i)=>{

list.innerHTML+=`
<div class="card">

<div class="name">${c.name}</div>

${c.photo?`<img src="${c.photo}" class="photo">`:""}

${c.ings.map(x=>`<div class="ing"><span>${x}</span><span></span></div>`).join("")}

<div class="tools">${c.tools.join(" • ")}</div>
<div class="recipe">${c.recipe}</div>

<div class="countBox">
<input type="number" min="0" value="0" onchange="setCount(${i},this.value)">
</div>

</div>`;
});
}

function setCount(i,val){
cocktails[i].count=parseInt(val)||0;
calc();
}

function calc(){
total=0;
cocktails.forEach(c=>{
total+=c.cost*c.count;
});
document.getElementById("sumBox").innerText="Сумма: "+total+" ₽";
}

function sendShift(){

const data=cocktails
.filter(c=>c.count>0)
.map(c=>({
name:c.name,
count:c.count,
cost:c.cost*c.count
}));

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(()=>{
alert("Смена записана в таблицу");
});
}
</script>

</body>
</html>
