<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Бармен PRO MAX</title>

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial;
    overflow-x:hidden;
}

header{
    position:sticky;
    top:0;
    background:#000;
    padding:12px;
    border-bottom:1px solid #222;
    z-index:999;
    text-align:center;
}

h1{
    margin:4px;
    font-size:22px;
}

#sum{
    color:#00ff66;
    font-size:20px;
    font-weight:bold;
}

#closeBtn{
    margin-top:8px;
    background:#00ff66;
    color:#000;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;
}

#list{
    padding:12px;
    max-width:700px;
    margin:auto;
}

.card{
    border:1px solid #333;
    border-radius:18px;
    padding:14px;
    margin-bottom:16px;
    text-align:center;
    background:#070707;
}

.name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:6px;
}

.photo{
    width:100%;
    max-width:260px;
    border-radius:14px;
    margin:8px auto;
    display:block;
}

.ing{
    text-align:left;
    margin-top:8px;
}

.ing.miss{
    color:#ff3b3b;
    text-decoration:line-through;
}

.tools{
    color:#00ff66;
    margin-top:8px;
}

.recipe{
    color:#aaa;
    margin-top:8px;
    font-size:14px;
}

.controls{
    margin-top:12px;
}

button.qty{
    width:36px;
    height:36px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:#222;
    color:#fff;
}

.count{
    width:60px;
    text-align:center;
    font-size:18px;
    margin:0 6px;
    background:#000;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
}

.disabled{
    opacity:.35;
}
</style>
</head>

<body>

<header>
<h1>Панель бармена ULTRA</h1>
Сумма: <span id="sum">0</span> ₽
<br>
<button id="closeBtn">Закрыть смену</button>
</header>

<div id="list"></div>

<script>
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz69f3BJpr-lFCk_-YzE1bq_CRcXniZEvt2rD4InM_qx15XYwN6IjzI2lbTPIaI3brk/exec";

const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;
const stockURL=`https://opensheet.elk.sh/${SHEET_ID}/Открытый_склад`;

let cocktails=[];
let stock={};
let total=0;

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json()),
fetch(stockURL).then(r=>r.json())
]).then(([techTxt,menu,stockData])=>{

stockData.forEach(r=>{
stock[r["ID ингридиента"]]=Number(r["Остаток"]);
});

const photos={};
menu.forEach(r=>photos[r.Коктейль]=r.Фото);

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;

let current=null;

rows.forEach(r=>{
const c=r.c;

const id=c[0]?.v;
const name=c[1]?.v;
const cost=c[3]?.v;
const ing=c[5]?.v;
const qty=c[6]?.v;
const unit=c[7]?.v;
const tool=c[9]?.v;
const recipe=c[10]?.v;

if(id){
current={
name:name,
cost:Number(cost)||0,
recipe:recipe||"",
tools:[],
ings:[],
photo:photos[name]||"",
count:0,
can:true
};
cocktails.push(current);
}

if(ing){
let miss=false;
if(stock[ing]!==undefined){
if(stock[ing]<qty){miss=true;current.can=false;}
}
current.ings.push({text:`${ing} ${qty} ${unit}`,miss});
}

if(tool) current.tools.push(tool);

});

render();
});

function render(){
const list=document.getElementById("list");
list.innerHTML="";

cocktails.forEach((c,i)=>{

let cls=c.can?"card":"card disabled";

list.innerHTML+=`
<div class="${cls}">
<div class="name">${c.name}</div>
${c.photo?`<img src="${c.photo}" class="photo">`:""}

<div class="ing">
${c.ings.map(x=>`<div class="${x.miss?"ing miss":"ing"}">${x.text}</div>`).join("")}
</div>

<div class="tools">${c.tools.join(" • ")}</div>
<div class="recipe">${c.recipe}</div>

<div class="controls">
<button class="qty" onclick="minus(${i})">-</button>
<input class="count" id="c${i}" value="${c.count}" readonly>
<button class="qty" onclick="plus(${i})">+</button>
</div>

</div>`;
});
calc();
}

function plus(i){
if(!cocktails[i].can) return;
cocktails[i].count++;
document.getElementById("c"+i).value=cocktails[i].count;
calc();
}

function minus(i){
if(cocktails[i].count>0) cocktails[i].count--;
document.getElementById("c"+i).value=cocktails[i].count;
calc();
}

function calc(){
total=0;
cocktails.forEach(c=>{
total+=c.count*c.cost;
});
document.getElementById("sum").innerText=Math.round(total);
}

document.getElementById("closeBtn").onclick=()=>{
const data=cocktails.filter(c=>c.count>0).map(c=>({
name:c.name,
count:c.count,
cost:c.cost
}));

if(data.length==0) return;

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
}).then(()=>{
cocktails.forEach(c=>c.count=0);
render();
});
};
</script>
</body>
</html>
