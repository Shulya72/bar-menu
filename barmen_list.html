<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
}

header{
position:sticky;
top:0;
background:#000;
padding:14px;
text-align:center;
border-bottom:1px solid #222;
z-index:999;
}

#sum{
color:#00ff66;
font-size:22px;
font-weight:bold;
}

#close{
background:#00ff66;
border:none;
padding:12px 20px;
border-radius:12px;
font-weight:bold;
margin-top:8px;
}

#list{
max-width:700px;
margin:auto;
padding:12px;
}

.card{
border:1px solid #333;
border-radius:18px;
padding:14px;
margin-bottom:16px;
text-align:center;
background:#050505;
}

.name{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.photo{
width:100%;
max-width:260px;
border-radius:12px;
margin:0 auto 10px;
display:block;
}

.count{
margin-top:10px;
font-size:22px;
}

button{
font-size:20px;
padding:6px 14px;
border-radius:10px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<header>
<div>Панель бармена</div>
<div id="sum">0 ₽</div>
<button id="close">Закрыть смену</button>
</header>

<div id="list"></div>

<script>

const SHEET="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";

let cocktails=[];
let counts={};
let total=0;

async function load(){

const tech=await fetch(`https://opensheet.elk.sh/${SHEET}/БАР_КУХНЯ`).then(r=>r.json());
const menu=await fetch(`https://opensheet.elk.sh/${SHEET}/MENU`).then(r=>r.json());

let current=null;

tech.forEach(r=>{

const name=r["Название"];
const ing=r["Ингредиент"];
const qty=r["Кол-во"];

if(name){
current={
name:name,
ings:[],
photo:(menu.find(m=>m["Коктейль"]==name)||{})["Фото"]||"",
cost:parseFloat((menu.find(m=>m["Коктейль"]==name)||{})["Цена"])||0
};
cocktails.push(current);
}

if(current && ing){
current.ings.push(`${ing} ${qty||""}`);
}

});

render();
}

function render(){
const list=document.getElementById("list");
list.innerHTML="";

cocktails.forEach((c,i)=>{

list.innerHTML+=`
<div class="card">
<div class="name">${c.name}</div>
${c.photo?`<img src="${c.photo}" class="photo">`:""}
${c.ings.join("<br>")}
<div class="count">
<button onclick="add(${i},-1)">-</button>
<span id="c${i}">0</span>
<button onclick="add(${i},1)">+</button>
</div>
</div>`;
});
}

function add(i,n){
counts[i]=(counts[i]||0)+n;
if(counts[i]<0) counts[i]=0;

document.getElementById("c"+i).innerText=counts[i];

total=0;
for(let k in counts){
total+=counts[k]*cocktails[k].cost;
}

document.getElementById("sum").innerText=Math.round(total)+" ₽";
}

load();

</script>
</body>
</html>
