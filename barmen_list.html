<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial;}

.top{position:fixed;top:0;left:0;width:100%;background:#000;z-index:999;padding:14px;border-bottom:1px solid #222;}
.title{text-align:center;font-size:22px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:20px;margin-top:2px;}

.tabs{display:flex;justify-content:space-around;margin-top:8px;border-bottom:1px solid #222;}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#777;font-size:13px;}
.tab.active{color:#7CFC00;border-bottom:2px solid #7CFC00;font-weight:600;}

.search{width:100%;padding:10px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:10px;}
.closeBtn{width:100%;padding:12px;border-radius:14px;background:#7CFC00;border:none;font-size:15px;font-weight:700;margin-top:8px;color:#000;}

.wrap{max-width:720px;margin:auto;padding:14px;padding-top:260px;}

.card{border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:22px;text-align:center;background:#070707;}
.card.dim{opacity:.45;}
.name{font-size:22px;font-weight:700;margin-bottom:10px;}
.photo{width:100%;max-width:260px;margin:0 auto 14px auto;border-radius:14px;}
.ing{text-align:left;margin-top:10px;}
.miss{color:#ff4d4d;text-decoration:line-through;}
.tools{color:#7CFC00;margin-top:10px;}
.recipe{color:#aaa;margin-top:10px;font-size:14px;}

.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;}
.btn{width:42px;height:42px;font-size:20px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;}
.count{width:60px;text-align:center;font-size:18px;background:#000;border:1px solid #444;border-radius:10px;color:#fff;height:36px;}

.screen{display:none;}
.screen.active{display:block;}

.day{margin-bottom:20px;padding:14px;border:1px solid #222;border-radius:14px;background:#050505;}
.dayTitle{font-size:18px;margin-bottom:10px;color:#7CFC00;}
.row{display:flex;justify-content:space-between;margin-bottom:6px;}
.total{margin-top:10px;font-weight:700;}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>

<div class="tabs">
<button class="tab active" onclick="showScreen('bar',this)">🍸 Бар</button>
<button class="tab" onclick="showScreen('stock',this)">📦 Склад</button>
<button class="tab" onclick="showScreen('shop',this)">🛒 Магазин</button>
<button class="tab" onclick="showScreen('stats',this);loadAccount()">📊 Учёт</button>
</div>

<div id="barTop">
<input class="search" placeholder="Поиск..." oninput="render()">
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>
</div>

<div class="wrap">

<div id="screen-bar" class="screen active">
<div id="list"></div>
</div>

<div id="screen-stock" class="screen"><h2>📦 Склад</h2></div>
<div id="screen-shop" class="screen"><h2>🛒 Магазин</h2></div>
<div id="screen-stats" class="screen"><h2>📊 Учёт</h2></div>

</div>

<script>
function showScreen(name,btn){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen-"+name).classList.add("active");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");

document.getElementById("barTop").style.display = name==="bar" ? "block":"none";
}
</script>

<script>
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby1q11YpzRc7VHUpq8IJdu4AUy5i25wjCI-hN9QqjWvXGQEHMk8aOnpH9xxKvmDi842/exec";
const ACCOUNT_URL=`https://opensheet.elk.sh/${SHEET_ID}/СМЕНЫ`;

const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const stockURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Открытый_склад`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;

let cocktails=[];
let total=0;
let sending=false;
let localStock={};

function norm(t){return String(t).replace(/\s+/g,"").toLowerCase();}
function normNum(v){return Number(String(v).replace(",",".").replace(/\s/g,""))||0;}

function loadStock(){
return fetch(stockURL).then(r=>r.text()).then(txt=>{
const json=JSON.parse(txt.substr(47).slice(0,-2));
let stock={};
json.table.rows.forEach(r=>{
const c=r.c;
if(c[0]?.v) stock[norm(c[0].v)]=normNum(c[1]?.v);
});
return stock;
});
}

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json()),
loadStock()
]).then(([techTxt,menu,stock])=>{

localStock=JSON.parse(JSON.stringify(stock));
let photos={};
menu.forEach(r=>photos[r.Коктейль]=r.Фото);

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;
let current=null;

rows.forEach(r=>{
const c=r.c;
if(c[0]?.v){
current={name:c[1].v,cost:parseFloat(c[3]?.v)||0,recipe:c[10]?.v||"",tools:[],ings:[],miss:false,photo:photos[c[1].v]||"",count:0};
cocktails.push(current);
}
if(c[5]?.v) current.ings.push({raw:c[5].v,need:Number(c[6]?.v)||0,unit:c[7]?.v,avail:c[8]?.v==1});
if(c[9]?.v) current.tools.push(c[9].v);
});

recalc();
render();
});

function recalc(){
cocktails.forEach(c=>{
c.miss=c.ings.some(i=>{
const left=localStock[norm(i.raw)]||0;
return left<i.need || !i.avail;
});
});
}

function render(){
const search=document.querySelector(".search").value.toLowerCase();
const list=document.getElementById("list");
list.innerHTML="";
total=0;

cocktails.forEach((c,i)=>{
if(search && !c.name.toLowerCase().includes(search)) return;
total+=c.count*c.cost;

list.innerHTML+=`
<div class="card ${c.miss?'dim':''}">
<div class="name">${c.name}</div>
${c.photo?`<img src="${c.photo}" class="photo">`:""}
<div class="ing">
${c.ings.map(x=>{
const left=localStock[norm(x.raw)]||0;
const ok=left>=x.need && x.avail;
return `<div class="${ok?'':'miss'}">${x.raw} ${x.need} ${x.unit} (ост: ${left})</div>`;
}).join("")}
</div>
<div class="tools">${c.tools.join(" • ")}</div>
<div class="recipe">${c.recipe}</div>
<div class="controls">
<button class="btn" onclick="minus(${i})">−</button>
<input class="count" value="${c.count}" readonly>
<button class="btn" onclick="plus(${i})">+</button>
</div>
</div>`;
});

document.getElementById("sum").innerText=Math.round(total);
}

function apply(i,delta){
const c=cocktails[i];
if(delta>0 && c.miss) return;
c.count+=delta;
if(c.count<0)c.count=0;

c.ings.forEach(ing=>{
const key=norm(ing.raw);
if(localStock[key]!=null){
localStock[key]-=ing.need*delta;
if(localStock[key]<0)localStock[key]=0;
}
});

recalc();
render();
}

function plus(i){apply(i,1);}
function minus(i){apply(i,-1);}

document.getElementById("closeBtn").onclick=closeShift;

function closeShift(){
if(sending)return;
const sum=Math.round(total);
if(sum<=0){alert("Нет заказов");return;}
if(!confirm(`Закрыть смену на ${sum} ₽ ?`))return;

sending=true;
const btn=document.getElementById("closeBtn");
btn.innerText="Отправка...";
btn.disabled=true;

const data=cocktails.filter(c=>c.count>0)
.map(c=>({name:c.name,count:c.count,cost:Math.round(c.cost*c.count)}));

fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(data)})
.then(()=>loadStock())
.then(stock=>{
localStock=JSON.parse(JSON.stringify(stock));
cocktails.forEach(c=>c.count=0);
recalc();render();
alert("Смена закрыта");
})
.finally(()=>{
sending=false;
btn.innerText="Закрыть смену";
btn.disabled=false;
});
}

function loadAccount(){
fetch(ACCOUNT_URL).then(r=>r.json()).then(rows=>{
let days={};

rows.forEach(r=>{
let d=r["Дата"];
if(!d)return;
let day=d.split(" ")[0];
if(!days[day])days[day]=[];
days[day].push(r);
});

let html="";

Object.keys(days).reverse().forEach(day=>{
let map={},dayTotal=0;

days[day].forEach(r=>{
let name=r["Коктейль"];
let qty=Number(r["Кол-во"])||0;
let cost=Number(r["Себестоимость"])||0;

if(!map[name]) map[name]={qty:0,cost:0};
map[name].qty+=qty;
map[name].cost+=cost;
dayTotal+=cost;
});

html+=`<div class="day"><div class="dayTitle">${day}</div>`;

Object.keys(map).forEach(name=>{
let c=map[name];
html+=`<div class="row"><div>${name} ×${c.qty}</div><div>${Math.round(c.cost)} ₽</div></div>`;
});

html+=`<div class="total">Итого: ${Math.round(dayTotal)} ₽</div></div>`;
});

document.getElementById("screen-stats").innerHTML="<h2>📊 Учёт</h2>"+html;
});
}
</script>

</body>
</html>
