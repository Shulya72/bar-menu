<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:#fff;
}

/* overlay */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.3s;
}
.overlay.show{
opacity:1;
pointer-events:auto;
}

.glassWrap{
width:200px;
height:260px;
position:relative;
}

/* бокал */
.glass{
stroke:#7CFC00;
stroke-width:4;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
filter:drop-shadow(0 0 6px #7CFC00)
       drop-shadow(0 0 12px #7CFC00);
}

/* жидкость */
.liquid{
fill:#7CFC00;
opacity:.25;
}

/* пузырьки */
.bubble{
fill:#7CFC00;
opacity:.9;
filter:drop-shadow(0 0 6px #7CFC00);
animation:rise linear infinite;
}

@keyframes rise{
0%{transform:translateY(0);opacity:0}
10%{opacity:1}
100%{transform:translateY(-140px);opacity:0}
}

/* ускорение при завершении */
.fast .bubble{
animation-duration:.7s !important;
}
</style>
</head>

<body>

<button onclick="closeShift()" style="margin:40px;font-size:20px">
Закрыть смену
</button>

<div id="overlay" class="overlay">
<div class="glassWrap">

<svg width="200" height="260" viewBox="0 0 200 260">

<!-- бокал -->
<path class="glass"
d="M30 30 H170 V80
C170 140 130 170 100 170
C70 170 30 140 30 80 Z"/>

<line class="glass" x1="100" y1="170" x2="100" y2="230"/>
<line class="glass" x1="60" y1="230" x2="140" y2="230"/>

<!-- жидкость -->
<rect class="liquid" x="40" y="80" width="120" height="90" rx="12"/>

<!-- пузырьки -->
<circle class="bubble" cx="80" cy="150" r="4" style="animation-duration:2.2s"/>
<circle class="bubble" cx="100" cy="170" r="3" style="animation-duration:2.5s"/>
<circle class="bubble" cx="120" cy="160" r="4" style="animation-duration:2s"/>
<circle class="bubble" cx="70" cy="180" r="3" style="animation-duration:2.4s"/>
<circle class="bubble" cx="130" cy="175" r="3" style="animation-duration:2.3s"/>

</svg>

</div>
</div>

<script>
let sending=false;

function closeShift(){

if(sending) return;
sending=true;

const overlay=document.getElementById("overlay");

overlay.classList.add("show");

/* имитация запроса сервера */
setTimeout(()=>{

/* ускоряем пузырьки */
overlay.classList.add("fast");

/* закрываем */
setTimeout(()=>{
overlay.classList.remove("show","fast");
sending=false;
},1200);

},3000);

}
</script>

</body>
</html>
