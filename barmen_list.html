<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial;
    margin:0;
    padding:10px;
}

.wrapper{
    max-width:420px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:22px;
}

#sumBox{
    text-align:center;
    font-size:20px;
    color:#7CFC00;
    margin-bottom:15px;
}

.card{
    background:#0b0b0b;
    border:1px solid #222;
    border-radius:18px;
    padding:14px;
    margin-bottom:16px;
    transition:.3s;
}

.card.disabled{
    opacity:.35;
}

.name{
    text-align:center;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.photo{
    width:100%;
    max-width:240px;
    display:block;
    margin:0 auto 10px auto;
    border-radius:12px;
}

.ing{
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.miss{
    text-decoration:line-through;
    color:#f55;
}

.tools{
    color:#7CFC00;
    text-align:center;
    font-size:13px;
    margin-top:6px;
}

.recipe{
    color:#aaa;
    text-align:center;
    font-size:13px;
}

input{
    width:70px;
    padding:8px;
    font-size:18px;
    text-align:center;
    background:#111;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
}

.countBox{
    text-align:center;
    margin-top:10px;
}

button{
    width:100%;
    padding:16px;
    font-size:18px;
    background:#7CFC00;
    border:none;
    border-radius:12px;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Панель бармена PRO</h1>
<div id="sumBox">Сумма: 0 ₽</div>
<div id="list"></div>

<button id="closeBtn" onclick="sendShift()">Закрыть смену</button>

</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw1Z5vyo_hwW5my_dFw8t49CnLVz7KZnzuPMiydht-d4SgJCVrpVKafsVqgfYGCAQ95/exec";
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";

const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;

let cocktails=[];
let total=0;
let sending=false;

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json())
])
.then(([techTxt,menu])=>{

let photos={};
let available={};

menu.forEach(r=>{
photos[r.Коктейль]=r.Фото;
available[r.Коктейль]=r.Доступность;
});

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;

let current=null;

rows.forEach(r=>{
const c=r.c;

const id=c[0]?.v;
const name=c[1]?.v;
const cost=c[3]?.v;
const ing=c[5]?.v;
const qty=c[6]?.v;
const unit=c[7]?.v;
const tool=c[9]?.v;
const recipe=c[10]?.v;
const ingOk=c[8]?.v;

if(id){
current={
name,
cost:parseFloat(cost)||0,
ings:[],
tools:[],
recipe:recipe||"",
photo:photos[name]||"",
count:0,
disabled:available[name]!=="ДА"
};
cocktails.push(current);
}

if(ing){
current?.ings.push({
text:`${ing} ${qty} ${unit}`,
ok:ingOk==1
});
}

if(tool){
current?.tools.push(tool);
}

});

render();
});

function render(){
const list=document.getElementById("list");
list.innerHTML="";

cocktails.forEach((c,i)=>{

list.innerHTML+=`
<div class="card ${c.disabled?'disabled':''}">

<div class="name">${c.name}</div>
${c.photo?`<img src="${c.photo}" class="photo">`:""}

${c.ings.map(x=>`
<div class="ing ${!x.ok?'miss':''}">
<span>${x.text}</span>
</div>`).join("")}

<div class="tools">${c.tools.join(" • ")}</div>
<div class="recipe">${c.recipe}</div>

<div class="countBox">
<input type="number" value="0" min="0"
${c.disabled?'disabled':''}
onchange="setCount(${i},this.value)">
</div>

</div>`;
});
}

function setCount(i,val){
cocktails[i].count=parseInt(val)||0;
calc();
}

function calc(){
total=0;
cocktails.forEach(c=>{
total+=c.cost*c.count;
});
document.getElementById("sumBox").innerText="Сумма: "+total+" ₽";
}

function sendShift(){

if(sending) return;
sending=true;

const btn=document.getElementById("closeBtn");
btn.innerText="Отправка...";
btn.disabled=true;

const data=cocktails
.filter(c=>c.count>0)
.map(c=>({
name:c.name,
count:c.count,
cost:c.cost*c.count
}));

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(()=>{

cocktails.forEach(c=>c.count=0);
document.querySelectorAll("input").forEach(i=>i.value=0);

calc();

btn.innerText="Закрыть смену";
btn.disabled=false;
sending=false;

alert("Смена сохранена");
});
}
</script>
</body>
</html>
