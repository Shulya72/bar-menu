<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial;
overflow-x:hidden;
}

.top{
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
z-index:999;
padding:14px;
box-sizing:border-box;
border-bottom:1px solid #222;
}

.title{text-align:center;font-size:22px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:20px;margin-top:2px;}

.tabs{
display:flex;
justify-content:space-around;
margin-top:8px;
border-bottom:1px solid #222;
}

.tab{
flex:1;
padding:8px 0;
background:none;
border:none;
color:#777;
font-size:13px;
}

.tab.active{
color:#7CFC00;
border-bottom:2px solid #7CFC00;
}

#barTop{padding-right:14px;}

.search{
width:100%;
padding:10px;
border-radius:12px;
border:1px solid #333;
background:#111;
color:#fff;
margin-top:10px;
box-sizing:border-box;
}

.closeBtn{
width:100%;
padding:12px;
border-radius:14px;
background:#7CFC00;
border:none;
font-size:15px;
font-weight:700;
margin-top:8px;
color:#000;
box-sizing:border-box;
}

/* УЧЕТ */
.statsFilter{
margin-top:10px;
display:flex;
gap:8px;
}

.statsFilter select{
flex:1;
padding:10px;
border-radius:10px;
background:#111;
color:#fff;
border:1px solid #333;
}

.statsSum{
margin-top:8px;
padding:12px;
border-radius:14px;
background:#7CFC00;
color:#000;
font-weight:700;
text-align:center;
}

.wrap{
max-width:720px;
margin:auto;
padding:14px;
padding-top:260px;
}

.card{
border:1px solid #333;
border-radius:18px;
padding:18px;
margin-bottom:22px;
text-align:center;
background:#070707;
}

.screen{display:none;}
.screen.active{display:block;}

.day{margin-bottom:20px;padding:14px;border:1px solid #222;border-radius:14px;background:#050505;}
.dayTitle{font-size:18px;margin-bottom:10px;color:#7CFC00;}
.row{display:flex;justify-content:space-between;margin-bottom:6px;}
.total{margin-top:10px;font-weight:700;}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>

<div class="tabs">
<button class="tab active" onclick="showScreen('bar',this)">🍸 Бар</button>
<button class="tab" onclick="showScreen('stock',this)">📦 Склад</button>
<button class="tab" onclick="showScreen('shop',this)">🛒 Магазин</button>
<button class="tab" onclick="showScreen('stats',this);loadAccount()">📊 Учёт</button>
</div>

<div id="barTop">
<input class="search" placeholder="Поиск..." oninput="render()">
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>

<!-- ФИЛЬТР УЧЕТА -->
<div id="statsTop" style="display:none">

<div class="statsFilter">
<select id="filterType" onchange="applyFilter()">
<option value="day">День</option>
<option value="month">Месяц</option>
<option value="year">Год</option>
</select>

<input type="date" id="filterDate" onchange="applyFilter()">
</div>

<div class="statsSum">Сумма: <span id="statsTotal">0</span> ₽</div>

</div>

</div>

<div class="wrap">

<div id="screen-bar" class="screen active">
<div id="list"></div>
</div>

<div id="screen-stock" class="screen"></div>
<div id="screen-shop" class="screen"></div>

<div id="screen-stats" class="screen">
<div id="account"></div>
</div>

</div>

<script>
function showScreen(name,btn){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen-"+name).classList.add("active");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");

document.getElementById("barTop").style.display = name==="bar" ? "block":"none";
document.getElementById("statsTop").style.display = name==="stats" ? "block":"none";
}
</script>

<script>
const ACCOUNT_URL="https://opensheet.elk.sh/1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8/СМЕНЫ";
let accountRows=[];

function loadAccount(){
fetch(ACCOUNT_URL)
.then(r=>r.json())
.then(rows=>{
accountRows=rows;
applyFilter();
});
}

function applyFilter(){
const type=document.getElementById("filterType").value;
const date=document.getElementById("filterDate").value;
if(!date)return;

let filtered={};
let totalSum=0;

accountRows.forEach(r=>{
let d=r["Дата"];
if(!d)return;
let day=d.split(" ")[0];

let match=false;

if(type==="day") match=day===date;
if(type==="month") match=day.slice(0,7)===date.slice(0,7);
if(type==="year") match=day.slice(0,4)===date.slice(0,4);

if(!match)return;

let name=r["Коктейль"];
let count=Number(r["Кол-во"])||0;
let cost=Number(r["Себестоимость"])||0;

if(!filtered[name]) filtered[name]={count:0,cost:0};

filtered[name].count+=count;
filtered[name].cost+=cost;
totalSum+=cost;
});

let html=`<div class="day">`;

Object.keys(filtered).forEach(name=>{
let obj=filtered[name];

html+=`
<div class="row">
<div>${name} ×${obj.count}</div>
<div>${Math.round(obj.cost)} ₽</div>
</div>`;
});

html+=`<div class="total">Итого: ${Math.round(totalSum)} ₽</div></div>`;

document.getElementById("account").innerHTML=html;
document.getElementById("statsTotal").innerText=Math.round(totalSum);
}
</script>

</body>
</html>
