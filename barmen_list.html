<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial;
overflow-x:hidden;
}

/* верх */
.top{
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
z-index:999;
padding:14px;
border-bottom:1px solid #222;
}
.title{text-align:center;font-size:24px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:22px;margin-top:4px;}

.closeBtn{
width:100%;
padding:14px;
border-radius:14px;
background:#7CFC00;
border:none;
font-size:16px;
font-weight:700;
margin-top:10px;
color:#000;
}

/* overlay */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.96);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.3s;
}
.overlay.show{opacity:1;pointer-events:auto;}

.scene{
width:300px;
height:220px;
position:relative;
}

/* неон */
.neon{
stroke:#7CFC00;
stroke-width:3;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
filter:drop-shadow(0 0 6px #7CFC00)
       drop-shadow(0 0 12px #7CFC00);
}

.fillNeon{
fill:#7CFC00;
opacity:.25;
filter:drop-shadow(0 0 10px #7CFC00);
}

/* стакан */
.glass{
position:absolute;
left:0;
bottom:0;
}

/* шейкер */
.shaker{
position:absolute;
right:0;
bottom:20px;
transform-origin:60% 80%;
}

/* idle качание */
.idle{
animation:idleShake 1.2s infinite;
}
@keyframes idleShake{
0%{transform:rotate(-6deg)}
50%{transform:rotate(6deg)}
100%{transform:rotate(-6deg)}
}

/* подъём */
.pour .shaker{
animation:lift .4s forwards;
}
@keyframes lift{
to{transform:translateY(-30px)}
}

/* наклон */
.pour2 .shaker{
animation:tilt .6s forwards;
}
@keyframes tilt{
to{transform:translateY(-30px) rotate(-65deg) translateX(-120px)}
}

/* струя */
.stream{
stroke:#7CFC00;
stroke-width:3;
opacity:0;
filter:drop-shadow(0 0 6px #7CFC00);
}
.pour2 .stream{animation:flow .8s forwards;}
@keyframes flow{to{opacity:1}}

/* наполнение стакана */
.liquid{
fill:#7CFC00;
opacity:.3;
transform-origin:bottom;
transform:scaleY(0);
}
.pour2 .liquid{animation:fill .9s forwards;}
@keyframes fill{to{transform:scaleY(1)}}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена PRO</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>

<!-- overlay -->
<div id="overlay" class="overlay">
<div class="scene">

<!-- стакан -->
<svg class="glass" width="140" height="170" viewBox="0 0 140 170">
<path class="neon"
d="M20 20 H120 V45
C120 75 95 95 70 95
C45 95 20 75 20 45 Z"/>
<line class="neon" x1="70" y1="95" x2="70" y2="140"/>
<line class="neon" x1="40" y1="140" x2="100" y2="140"/>
<rect class="liquid" x="28" y="45" width="84" height="45" rx="10"/>
</svg>

<!-- шейкер -->
<svg id="shaker" class="shaker idle" width="140" height="170" viewBox="0 0 140 170">
<rect class="neon" x="55" y="15" width="30" height="40" rx="10"/>
<rect class="neon" x="40" y="50" width="60" height="20" rx="10"/>
<rect class="neon" x="50" y="65" width="40" height="70" rx="20"/>
<rect class="fillNeon" x="58" y="95" width="24" height="25" rx="8"/>
</svg>

<!-- струя -->
<svg width="300" height="200" class="stream">
<path d="M210 80 C170 95 140 110 100 125"/>
</svg>

</div>
</div>

<script>
let sending=false;

function closeShift(){

if(sending) return;
sending=true;

const overlay=document.getElementById("overlay");
const shaker=document.getElementById("shaker");

overlay.classList.add("show");
shaker.classList.add("idle");

/* имитация запроса */
setTimeout(()=>{

shaker.classList.remove("idle");
overlay.classList.add("pour");

setTimeout(()=>{
overlay.classList.add("pour2");
},400);

/* конец */
setTimeout(()=>{
overlay.classList.remove("show","pour","pour2");
shaker.classList.add("idle");
sending=false;
},1600);

},2500);
}

document.getElementById("closeBtn").onclick=closeShift;
</script>

</body>
</html>
