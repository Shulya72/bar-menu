<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бармен PRO</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial;
overflow-x:hidden;
}

/* верх */
.top{
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
z-index:999;
padding:14px;
box-sizing:border-box;
border-bottom:1px solid #222;
}

.title{text-align:center;font-size:22px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:20px;margin-top:2px;}

/* вкладки */
.tabs{
display:flex;
justify-content:space-around;
margin-top:8px;
border-bottom:1px solid #222;
}

.tab{
flex:1;
padding:8px 0;
background:none;
border:none;
color:#777;
font-size:13px;
}

.tab.active{
color:#7CFC00;
border-bottom:2px solid #7CFC00;
font-weight:600;
}

.search{
width:100%;
padding:10px;
border-radius:12px;
border:1px solid #333;
background:#111;
color:#fff;
margin-top:10px;
box-sizing:border-box;
}

.closeBtn{
width:100%;
padding:12px;
border-radius:14px;
background:#7CFC00;
border:none;
font-size:15px;
font-weight:700;
margin-top:8px;
color:#000;
}

.wrap{
max-width:720px;
margin:auto;
padding:14px;
padding-top:260px;
}

/* учёт поднимаем вверх но красиво */
#screen-stats{
margin-top:-150px;
}

.card{
border:1px solid #333;
border-radius:18px;
padding:18px;
margin-bottom:22px;
text-align:center;
background:#070707;
}

.card.dim{opacity:.45;}
.name{font-size:22px;font-weight:700;margin-bottom:10px;}
.photo{width:100%;max-width:260px;margin:0 auto 14px auto;display:block;border-radius:14px;}
.ing{text-align:left;margin-top:10px;}
.miss{color:#ff4d4d;text-decoration:line-through;}
.tools{color:#7CFC00;margin-top:10px;}
.recipe{color:#aaa;margin-top:10px;font-size:14px;}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:12px;
}

.btn{
width:42px;height:42px;font-size:20px;
border-radius:10px;
border:1px solid #444;
background:#111;
color:#fff;
}

.count{
width:60px;
text-align:center;
font-size:18px;
background:#000;
border:1px solid #444;
border-radius:10px;
color:#fff;
height:36px;
}

.screen{display:none;}
.screen.active{display:block;}

.day{
margin-top:18px;
padding:18px;
border:1px solid #333;
border-radius:18px;
background:#050505;
max-width:600px;
}

.dayTitle{
font-size:20px;
color:#7CFC00;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:6px;
}

.total{
margin-top:10px;
font-weight:700;
}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>

<div class="tabs">
<button class="tab active" onclick="showScreen('bar',this)">🍸 Бар</button>
<button class="tab" onclick="showScreen('stock',this)">📦 Склад</button>
<button class="tab" onclick="showScreen('shop',this)">🛒 Магазин</button>
<button class="tab" onclick="showScreen('stats',this);loadAccount()">📊 Учёт</button>
</div>

<div id="barTop">
<input class="search" placeholder="Поиск..." oninput="render()">
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>
</div>

<div class="wrap">

<div id="screen-bar" class="screen active">
<div id="list"></div>
</div>

<div id="screen-stock" class="screen"></div>
<div id="screen-shop" class="screen"></div>

<div id="screen-stats" class="screen">
<div id="account"></div>
</div>

</div>

<script>
function showScreen(name,btn){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen-"+name).classList.add("active");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");

document.getElementById("barTop").style.display = name==="bar" ? "block":"none";
}
</script>

<script>
const ACCOUNT_URL="https://opensheet.elk.sh/1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8/СМЕНЫ";

function loadAccount(){
fetch(ACCOUNT_URL)
.then(r=>r.json())
.then(rows=>{

let days={};

rows.forEach(r=>{
let d=r["Дата"];
if(!d) return;
let day=d.split(" ")[0];
if(!days[day]) days[day]={};
    
let name=r["Коктейль"];
let count=Number(r["Кол-во"])||0;
let cost=Number(r["Себестоимость"])||0;

if(!days[day][name]){
days[day][name]={count:0,cost:0};
}

days[day][name].count+=count;
days[day][name].cost+=cost;
});

let html="";

Object.keys(days).reverse().forEach(day=>{
let sum=0;

html+=`<div class="day"><div class="dayTitle">${day}</div>`;

Object.keys(days[day]).forEach(name=>{
let item=days[day][name];
sum+=item.cost;

html+=`
<div class="row">
<div>${name} ×${item.count}</div>
<div>${Math.round(item.cost)} ₽</div>
</div>`;
});

html+=`<div class="total">Итого: ${Math.round(sum)} ₽</div></div>`;
});

document.getElementById("account").innerHTML=html;

});
}
</script>

<!-- ВАШ БАРНЫЙ JS (рабочий) -->
<script src="bar.js"></script>

</body>
</html>
