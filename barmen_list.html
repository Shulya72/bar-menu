<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Бармен PRO</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
overflow-x:hidden;
}

header{
position:sticky;
top:0;
background:#000;
padding:14px;
z-index:999;
border-bottom:1px solid #222;
text-align:center;
}

#sum{
color:#00ff66;
font-size:22px;
font-weight:bold;
}

#close{
background:#00ff66;
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:bold;
margin-top:8px;
}

#list{
max-width:700px;
margin:auto;
padding:12px;
}

.card{
border:1px solid #333;
border-radius:18px;
padding:14px;
margin-bottom:16px;
text-align:center;
background:#050505;
}

.card.disabled{
opacity:.35;
}

.name{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.photo{
width:100%;
max-width:260px;
border-radius:12px;
margin:0 auto 10px;
display:block;
}

.ing{
display:flex;
justify-content:space-between;
}

.miss{
color:red;
text-decoration:line-through;
}

.count{
font-size:22px;
margin-top:8px;
}

button{
font-size:22px;
padding:6px 14px;
border-radius:10px;
border:none;
background:#111;
color:#fff;
}

</style>
</head>

<body>

<header>
<div>Панель бармена PRO</div>
<div id="sum">0 ₽</div>
<button id="close">Закрыть смену</button>
</header>

<div id="list"></div>

<script>
const SHEET="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
const SCRIPT="https://script.google.com/macros/s/AKfycbz69f3BJpr-lFCk_-YzE1bq_CRcXniZEvt2rD4InM_qx15XYwN6IjzI2lbTPIaI3brk/exec";

let cocktails=[];
let stock={};
let total=0;

async function load(){

const tech=await fetch(`https://opensheet.elk.sh/${SHEET}/БАР_КУХНЯ`).then(r=>r.json());
const menu=await fetch(`https://opensheet.elk.sh/${SHEET}/MENU`).then(r=>r.json());
const skl=await fetch(`https://opensheet.elk.sh/${SHEET}/Открытый_склад`).then(r=>r.json());

skl.forEach(r=>{
stock[r["ID ингридиента"]]=parseFloat(r["Остаток"])||0;
});

menu.forEach(m=>{
let obj={
name:m.Коктейль,
photo:m.Фото,
ings:[],
cost:parseFloat(m.Цена)||0
};

tech.forEach(t=>{
if(t["Коктейль"]==m.Коктейль){
obj.ings.push({
name:t["Ингредиент"],
qty:parseFloat(t["Кол-во"])||0
});
}
});

cocktails.push(obj);
});

render();
}

function render(){
const list=document.getElementById("list");
list.innerHTML="";

cocktails.forEach((c,i)=>{

let can=true;
let html="";

c.ings.forEach(x=>{
let ok=(stock[x.name]||0)>=x.qty;
if(!ok) can=false;

html+=`<div class="ing ${ok?"":"miss"}">
<span>${x.name}</span>
<span>${x.qty}</span>
</div>`;
});

list.innerHTML+=`
<div class="card ${can?"":"disabled"}">
<div class="name">${c.name}</div>
<img src="${c.photo}" class="photo">
${html}
<div class="count">
<button onclick="add(${i},-1)">-</button>
<span id="c${i}">0</span>
<button onclick="add(${i},1)">+</button>
</div>
</div>
`;
});
}

let counts={};

function add(i,n){
counts[i]=(counts[i]||0)+n;
if(counts[i]<0) counts[i]=0;
document.getElementById("c"+i).innerText=counts[i];

total=0;
for(let k in counts){
total+=counts[k]*cocktails[k].cost;
}

document.getElementById("sum").innerText=Math.round(total)+" ₽";
}

document.getElementById("close").onclick=async ()=>{
if(total==0) return;

document.getElementById("close").disabled=true;

let send=[];
for(let i in counts){
if(counts[i]>0){
send.push({
name:cocktails[i].name,
count:counts[i],
cost:cocktails[i].cost
});
}
}

await fetch(SCRIPT,{
method:"POST",
body:JSON.stringify(send)
});

counts={};
total=0;
document.getElementById("sum").innerText="0 ₽";
render();

document.getElementById("close").disabled=false;
};

load();
</script>

</body>
</html>
