<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бармен PRO</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial;
overflow-x:hidden;
touch-action:manipulation;
}

.top{
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
z-index:999;
padding:14px;
box-sizing:border-box;
border-bottom:1px solid #222;
}

.title{ text-align:center;font-size:24px;font-weight:700;}
.sum{ text-align:center;color:#7CFC00;font-size:22px;margin-top:4px;}

.search{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #333;
background:#111;
color:#fff;
margin-top:10px;
}

.closeBtn{
width:100%;
padding:14px;
border-radius:14px;
background:#7CFC00;
border:none;
font-size:16px;
font-weight:700;
margin-top:10px;
}

.wrap{
max-width:720px;
margin:auto;
padding:14px;
padding-top:210px;
}

.card{
border:1px solid #333;
border-radius:18px;
padding:18px;
margin-bottom:22px;
text-align:center;
background:#070707;
}

.card.dim{opacity:.45;}
.name{font-size:22px;font-weight:700;margin-bottom:10px;}

.photo{
width:100%;
max-width:260px;
margin:0 auto 14px auto;
display:block;
border-radius:14px;
pointer-events:none;
}

.ing{text-align:left;margin-top:10px;}
.miss{color:#ff4d4d;text-decoration:line-through;}
.tools{color:#7CFC00;margin-top:10px;}
.recipe{color:#aaa;margin-top:10px;font-size:14px;}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:12px;
}

.btn{
width:42px;height:42px;font-size:20px;border-radius:10px;
border:1px solid #444;background:#111;color:#fff;
}

.count{
width:60px;text-align:center;font-size:18px;background:#000;
border:1px solid #444;border-radius:10px;color:#fff;height:36px;
}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена PRO</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>
<input class="search" placeholder="Поиск..." oninput="render()">
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>

<div class="wrap">
<div id="list"></div>
</div>

<script>
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz69f3BJpr-lFCk_-YzE1bq_CRcXniZEvt2rD4InM_qx15XYwN6IjzI2lbTPIaI3brk/exec";

const techURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=БАР_КУХНЯ`;
const menuURL=`https://opensheet.elk.sh/${SHEET_ID}/MENU`;
const stockURL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Открытый_склад`;

let cocktails=[];
let total=0;
let sending=false;

function norm(t){
return String(t)
.replace(/\u00A0/g," ")
.replace(/\s+/g," ")
.trim()
.toLowerCase();
}

Promise.all([
fetch(techURL).then(r=>r.text()),
fetch(menuURL).then(r=>r.json()),
fetch(stockURL).then(r=>r.text())
]).then(([techTxt,menu,stockTxt])=>{

let photos={};
menu.forEach(r=>photos[r.Коктейль]=r.Фото);

let stockMap={};
const stockJson=JSON.parse(stockTxt.substr(47).slice(0,-2));
const stockRows=stockJson.table.rows;

for(let i=1;i<stockRows.length;i++){
const row=stockRows[i].c;
if(!row) continue;

let rawName=row[0]?.v ?? row[0]?.f ?? "";
let rawQty=(row[1]?.v ?? row[1]?.f ?? 0);

// 🔥 фикс чисел вида "1 000,00"
rawQty=String(rawQty)
.replace(/\s/g,"")
.replace(",",".")
.replace(/\u00A0/g,"");

let cleanQty=Number(rawQty)||0;
let cleanName=norm(rawName);

if(cleanName){
stockMap[cleanName]=cleanQty;
}

// спец-фикс водки
if(cleanName.includes("водк")){
stockMap["водка"]=cleanQty;
}

console.log("СКЛАД:",cleanName,cleanQty);
}

const json=JSON.parse(techTxt.substr(47).slice(0,-2));
const rows=json.table.rows;

let current=null;

rows.forEach(r=>{
const c=r.c;

const id=c[0]?.v;
const name=c[1]?.v;
const cost=c[3]?.v;
const ing=c[5]?.v;
const qtyRaw=c[6]?.v;
const unit=c[7]?.v;
const avail=c[8]?.v;
const tool=c[9]?.v;
const recipe=c[10]?.v;

if(id){
current={
name,
cost:parseFloat(cost)||0,
recipe:recipe||"",
tools:[],
ings:[],
miss:false,
photo:photos[name]||"",
count:0
};
cocktails.push(current);
}

if(ing){
const need=Number(qtyRaw)||0;
const stockLeft=Number(stockMap[norm(ing)]||0);

console.log("ПРОВЕРКА:",ing,"=>",stockLeft);

current.ings.push({
text:`${ing} ${need} ${unit} (ост: ${stockLeft})`,
ok:avail==1 && stockLeft>=need
});

if(stockLeft<need || avail==0) current.miss=true;
}

if(tool) current.tools.push(tool);
});

render();
});

function render(){
const search=document.querySelector(".search").value.toLowerCase();
const list=document.getElementById("list");
list.innerHTML="";
total=0;

cocktails.forEach((c,i)=>{
if(search && !c.name.toLowerCase().includes(search)) return;
total+=c.count*c.cost;

list.innerHTML+=`
<div class="card ${c.miss?'dim':''}">
<div class="name">${c.name}</div>
${c.photo?`<img src="${c.photo}" class="photo">`:""}

<div class="ing">
${c.ings.map(x=>`<div class="${x.ok?'':'miss'}">${x.text}</div>`).join("")}
</div>

<div class="tools">${c.tools.join(" • ")}</div>
<div class="recipe">${c.recipe}</div>

<div class="controls">
<button class="btn" onclick="minus(${i})">−</button>
<input class="count" value="${c.count}" readonly>
<button class="btn" onclick="plus(${i})">+</button>
</div>
</div>`;
});

document.getElementById("sum").innerText=Math.round(total);
}

function plus(i){cocktails[i].count++;render();}
function minus(i){if(cocktails[i].count>0) cocktails[i].count--;render();}

document.getElementById("closeBtn").onclick=closeShift;

function closeShift(){
if(sending) return;
sending=true;

const btn=document.getElementById("closeBtn");
btn.innerText="Отправка...";
btn.disabled=true;

const data=cocktails
.filter(c=>c.count>0)
.map(c=>({name:c.name,count:c.count,cost:c.cost*c.count}));

fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(data)})
.then(()=>{
cocktails.forEach(c=>c.count=0);
total=0;
render();
alert("Смена закрыта");
})
.finally(()=>{
sending=false;
btn.innerText="Закрыть смену";
btn.disabled=false;
});
}
</script>

</body>
</html>
