<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бармен PRO</title>

<style>
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial;overflow-x:hidden;}

.top{position:fixed;top:0;left:0;width:100%;background:#000;z-index:999;padding:14px;border-bottom:1px solid #222;}
.title{text-align:center;font-size:22px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:20px;margin-top:2px;}

.tabs{display:flex;justify-content:space-around;margin-top:8px;border-bottom:1px solid #222;}
.tab{flex:1;padding:8px 0;background:none;border:none;color:#777;font-size:13px;}
.tab.active{color:#7CFC00;border-bottom:2px solid #7CFC00;font-weight:600;}

.search{width:100%;padding:10px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:10px;}

.closeBtn{
width:100%;padding:12px;border-radius:14px;
background:#7CFC00;border:none;font-size:15px;
font-weight:700;margin-top:8px;color:#000;
}

.wrap{max-width:720px;margin:auto;padding:14px;padding-top:260px;}
.screen{display:none;}
.screen.active{display:block;}

.day{margin-bottom:20px;padding:14px;border:1px solid #222;border-radius:14px;background:#050505;}
.dayTitle{font-size:18px;margin-bottom:10px;color:#7CFC00;}
.row{display:flex;justify-content:space-between;margin-bottom:6px;}
.total{margin-top:10px;font-weight:700;}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>

<div class="tabs">
<button class="tab active" onclick="showScreen('bar',this)">🍸 Бар</button>
<button class="tab" onclick="showScreen('stock',this)">📦 Склад</button>
<button class="tab" onclick="showScreen('shop',this)">🛒 Магазин</button>
<button class="tab" onclick="showScreen('stats',this);loadStats()">📊 Учёт</button>
</div>

<div id="barTop">
<input class="search" placeholder="Поиск..." oninput="render()">
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>
</div>

<div class="wrap">

<div id="screen-bar" class="screen active">
<div id="list"></div>
</div>

<div id="screen-stock" class="screen">
<h2>Склад позже</h2>
</div>

<div id="screen-shop" class="screen">
<h2>Магазин позже</h2>
</div>

<div id="screen-stats" class="screen">
<div id="stats"></div>
</div>

</div>

<script>
function showScreen(name,btn){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen-"+name).classList.add("active");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");

document.getElementById("barTop").style.display = name==="bar" ? "block":"none";
}
</script>

<script>
const SHEET_ID="1CceZ3cIic_k9Z9GnXg_wOzoUGdYonzVkfypmSzf_ln8";
const statsURL=`https://opensheet.elk.sh/${SHEET_ID}/СМЕНЫ`;

function loadStats(){
fetch(statsURL)
.then(r=>r.json())
.then(rows=>{

let days={};

rows.forEach(r=>{
const d=new Date(r.Дата).toLocaleDateString("ru-RU");
if(!days[d]) days[d]=[];
days[d].push(r);
});

let html="";

Object.keys(days).reverse().forEach(day=>{
let sum=0;

html+=`<div class="day"><div class="dayTitle">${day}</div>`;

days[day].forEach(r=>{
sum+=Number(r.Себестоимость)||0;
html+=`
<div class="row">
<div>${r.Коктейль} ×${r["Кол-во"]}</div>
<div>${r.Себестоимость} ₽</div>
</div>`;
});

html+=`<div class="total">Итого: ${sum} ₽</div></div>`;
});

document.getElementById("stats").innerHTML=html;
});
}
</script>

<!-- ТВОЙ СТАРЫЙ БАРМЕНСКИЙ JS НЕ ТРОГАЮ -->
<script src=""></script>

</body>
</html>
