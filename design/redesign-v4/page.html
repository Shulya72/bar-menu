<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VIA — слоновая кость и бордо</title>
<link rel="stylesheet" href="fonts/cormorant-garamond/500.css">
<link rel="stylesheet" href="fonts/cormorant-garamond/600.css">
<link rel="stylesheet" href="fonts/cormorant-garamond/500-italic.css">
<link rel="stylesheet" href="fonts/manrope/400.css">
<link rel="stylesheet" href="fonts/manrope/500.css">
<link rel="stylesheet" href="fonts/manrope/600.css">
<link rel="stylesheet" href="fonts/manrope/700.css">
<style>
/* «Слоновая кость и бордо»: лёгкий премиальный бар. Одна разметка — две темы:
   день (слоновая кость, бордо, золото) и вечер (бордо, золото, крем). */
.t-light{
  --bg:#F6EFE5;--paint:radial-gradient(120% 46% at 50% -8%,#FFFBF5 0,rgba(255,251,245,0) 64%);
  --surface:#FFFDF9;--surface-2:#F0E6D8;--surface-3:#E5D6C3;
  --line:rgba(94,26,40,.09);--line-2:rgba(94,26,40,.17);
  --ink:#2A0E16;--ink-2:#5E464B;--ink-3:#765C61;
  --accent:#6E1A2B;--gold:#A27C3A;--gold-line:rgba(162,124,58,.55);
  --btn:linear-gradient(180deg,#7C2335,#5F1626);--btn-ink:#FBF2E4;--btn-solid:#6E1A2B;
  --btn2:#EFE4D5;--btn2-ink:#4A1622;
  --tint:rgba(110,26,43,.08);--tint-ink:#6E1A2B;
  --ok:#2E7656;--ok-tint:rgba(46,118,86,.12);--warn:#A85B12;--warn-tint:rgba(190,110,30,.13);--danger:#B0263A;--danger-tint:rgba(176,38,58,.1);
  --shadow:0 14px 32px rgba(84,24,38,.09),0 2px 6px rgba(84,24,38,.05);
  --photo-shadow:0 12px 26px rgba(84,24,38,.16);
  --bar:rgba(255,252,247,.88);--field:#EFE6DA;
  --card-glow:rgba(110,26,43,.0);
  color-scheme:light;
}
.t-dark{
  --bg:#1A090F;--paint:radial-gradient(120% 46% at 50% -8%,rgba(128,33,54,.62) 0,rgba(128,33,54,0) 64%);
  --surface:#27101A;--surface-2:#351620;--surface-3:#45202B;
  --line:rgba(236,210,165,.09);--line-2:rgba(236,210,165,.18);
  --ink:#F6ECDF;--ink-2:#D5BEB3;--ink-3:#AE958D;
  --accent:#E3C380;--gold:#E3C380;--gold-line:rgba(227,195,128,.5);
  --btn:linear-gradient(180deg,#ECD196,#C9A15A);--btn-ink:#2A0E16;--btn-solid:#DDBB78;
  --btn2:#3A1823;--btn2-ink:#F2DFC0;
  --tint:rgba(227,195,128,.13);--tint-ink:#E9CB8C;
  --ok:#86D2A9;--ok-tint:rgba(134,210,169,.13);--warn:#F2B46A;--warn-tint:rgba(242,180,106,.14);--danger:#FF8E8E;--danger-tint:rgba(255,142,142,.12);
  --shadow:0 16px 36px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.25);
  --photo-shadow:none;
  --bar:rgba(26,9,15,.86);--field:#2E121B;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;padding:24px;display:flex;flex-wrap:wrap;gap:24px;font-family:Manrope,sans-serif}
.screen{position:relative;width:390px;height:844px;overflow:hidden;flex:none;background:var(--paint),var(--bg);color:var(--ink);font:500 15px/1.4 Manrope,sans-serif;font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}
.screen ::selection{background:var(--accent);color:var(--bg)}
.scroll{position:absolute;inset:0;padding:0 20px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Статус-бар, полоса «домой» */
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 36px;font:600 15px/1 Manrope;color:var(--ink);z-index:40}
.sb .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.8;z-index:60}

/* Типографика */
.serif{font-family:"Cormorant Garamond",serif}
.h1{font:600 36px/1.02 "Cormorant Garamond",serif;letter-spacing:-.005em}
.h2{font:600 25px/1.1 "Cormorant Garamond",serif}
.nm{font:600 19px/1.12 "Cormorant Garamond",serif;letter-spacing:.005em}
.sub{font:500 14px/1.45 Manrope;color:var(--ink-2)}
.sm{font:500 12.5px/1.4 Manrope;color:var(--ink-3)}
.lbl{font:700 11px/1 Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-weight:700}
.acc{color:var(--accent)}

/* Шапка страницы */
.head{display:flex;align-items:flex-end;justify-content:space-between;padding-top:64px;gap:12px}
.head .sub{margin-top:6px}
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--accent);flex:none}

/* Поиск, вкладки, переключатель */
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;background:var(--field);padding:0 16px;color:var(--ink-3);font:500 15px/1 Manrope;margin-top:18px}
.search svg{width:19px;height:19px}
.tabs{display:flex;gap:22px;margin-top:16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tabs span{position:relative;padding:10px 0 12px;font:600 14.5px/1 Manrope;color:var(--ink-3)}
.tabs span small{font:600 11px/1 Manrope;margin-left:4px;opacity:.75}
.tabs span.on{color:var(--ink)}
.tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--gold)}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface-2);margin-top:18px}
.seg span{flex:1;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:7px;font:600 14px/1 Manrope;color:var(--ink-2)}
.seg span.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg span i{font:700 11px/19px Manrope;font-style:normal;min-width:19px;height:19px;border-radius:10px;padding:0 5px;background:var(--tint);color:var(--tint-ink);text-align:center}

/* Карточки и списки */
/* flow-root: внутренние отступы детей остаются внутри карточки, а не «вытекают» наружу */
.card{display:flow-root;background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.rows>.row{display:flex;align-items:center;gap:13px;padding:13px 16px;position:relative}
.rows>.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.rows>.row .body{flex:1;min-width:0}
.chev{width:17px;height:17px;color:var(--ink-3)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--tint-ink);flex:none}
.ico svg{width:19px;height:19px}

/* Кнопки, статусы, счётчик */
.btn{height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1 Manrope;letter-spacing:.01em;background:var(--btn);color:var(--btn-ink);box-shadow:0 10px 22px rgba(80,18,34,.18)}
.btn svg{width:18px;height:18px}
.btn.s{height:40px;border-radius:13px;font-size:14px;padding:0 16px}
.btn-2{background:var(--btn2);color:var(--btn2-ink);box-shadow:none}
.btn-o{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.4px var(--gold-line)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font:700 11.5px/1 Manrope;white-space:nowrap}
.p-new{background:var(--tint);color:var(--tint-ink)}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-out{background:var(--danger-tint);color:var(--danger)}
.stp{display:inline-flex;align-items:center;justify-content:space-between;height:34px;width:96px;border-radius:17px;box-shadow:inset 0 0 0 1.4px var(--gold-line);color:var(--accent);padding:0 4px;font:700 14.5px/1 Manrope}
.stp b{color:var(--ink);font-weight:700}
.stp svg{width:16px;height:16px;margin:0 6px}

/* Нижняя панель и полоса заказа */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--line);display:flex;padding:0 6px;z-index:30}
.tabbar .t{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:11px;font:600 10.5px/1 Manrope;color:var(--ink-3)}
.tabbar .t.on{color:var(--accent)}
.tabbar .t.on::before{content:"";position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:var(--gold)}
.tabbar .t svg{width:24px;height:24px}
.badge{position:absolute;top:6px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--btn-solid);color:var(--btn-ink);font:700 10.5px/18px Manrope;text-align:center}
.cartbar{position:absolute;left:14px;right:14px;bottom:98px;height:60px;border-radius:20px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;box-shadow:0 18px 34px rgba(60,12,24,.32);z-index:31}
.cartbar .q{font:700 15px/1.2 Manrope}
.cartbar .q{flex:1;min-width:0}
.cartbar .q small{display:block;font:500 12.5px/1.2 Manrope;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartbar .go{flex:none;white-space:nowrap;margin-left:auto;height:42px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:6px;font:700 14px/1 Manrope;background:rgba(255,255,255,.14)}
.t-dark .cartbar .go{background:rgba(42,14,22,.12)}
.cartbar .go svg{width:16px;height:16px}

/* Фото */
/* Фото коктейля — снимок в бордовом баре; в обеих темах чёткая карточка со скруглёнными углами. */
.ph{position:relative;border-radius:20px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.t-light .ph{box-shadow:0 12px 26px rgba(84,24,38,.18)}
.t-dark .ph{box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 1px rgba(227,195,128,.14)}
.th{width:54px;height:54px;border-radius:14px;overflow:hidden;flex:none;background:#2A0A14}
.th img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="coupe" viewBox="0 0 24 24"><path d="M3.5 5.5h17c0 4.4-3.8 7.6-8.5 7.6S3.5 9.9 3.5 5.5z"/><path d="M12 13.1V20M8 20.2h8"/></symbol>
  <symbol id="chit" viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20.5c1-3.9 3.8-6 7.2-6s6.2 2.1 7.2 6"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11"/><path d="M9.5 8h5"/></symbol>
  <symbol id="bottle" viewBox="0 0 24 24"><path d="M10 2.5h4v4.2c0 1 2.5 2.2 2.5 5v8.3a1.5 1.5 0 0 1-1.5 1.5H9a1.5 1.5 0 0 1-1.5-1.5v-8.3c0-2.8 2.5-4 2.5-5z"/><path d="M7.5 13.5h9"/></symbol>
  <symbol id="bag" viewBox="0 0 24 24"><path d="M4.5 8h15l-1 12.5h-13z"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3"/></symbol>
  <symbol id="more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></symbol>
  <symbol id="repeat" viewBox="0 0 24 24"><path d="M5 11V9.5A3.5 3.5 0 0 1 8.5 6H18"/><path d="M15.5 3.5L18 6l-2.5 2.5"/><path d="M19 13v1.5a3.5 3.5 0 0 1-3.5 3.5H6"/><path d="M8.5 20.5L6 18l2.5-2.5"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
  <symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l8-8"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/></symbol>
  <symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3.5L9 5.5h6L16.5 8H20v11H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 15.9l-4.9 2.7 1.1-5.3-4-3.7 5.4-.6z"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M5 20v-8.5L12 5l7 6.5V20z"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><path d="M6 11h12v9H6z"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></symbol>
  <symbol id="logout" viewBox="0 0 24 24"><path d="M14 4.5H6v15h8"/><path d="M11 12h9M17 9l3 3-3 3"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M4 12l16-7-6 15-2.5-6.5z"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.8"/></symbol>
  <symbol id="phone" viewBox="0 0 24 24"><path d="M6.5 4h3l1.5 4-2 1.3a10 10 0 0 0 5.7 5.7l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 6.2 2 2 0 0 1 6.5 4z"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="sig" viewBox="0 0 24 24"><path d="M4 18v-2M9 18v-5M14 18v-8M19 18V7" stroke-width="2.6"/></symbol>
  <symbol id="wifi" viewBox="0 0 24 24"><path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 12.8a7.6 7.6 0 0 1 11 0M9.6 16a3.2 3.2 0 0 1 4.8 0" stroke-width="2.1"/></symbol>
</defs></svg>
<div id="root"></div>
<script src="data.js"></script>
<script src="screens.js"></script>
</body>
</html>
