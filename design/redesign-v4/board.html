<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>VIA — доска</title>
<link rel="stylesheet" href="fonts/cormorant-garamond/600.css">
<link rel="stylesheet" href="fonts/cormorant-garamond/500-italic.css">
<link rel="stylesheet" href="fonts/manrope/500.css">
<link rel="stylesheet" href="fonts/manrope/700.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1318px;padding:48px 44px 44px;font-family:Manrope,sans-serif}
body.l{background:radial-gradient(90% 30% at 50% 0%,#FFFBF5,#F3EADF 70%);color:#2A0E16}
body.d{background:radial-gradient(90% 30% at 50% 0%,#4A1424,#16070C 70%);color:#F6ECDF}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
h1{font:600 64px/1 "Cormorant Garamond"}
body.l h1 em{color:#6E1A2B}body.d h1 em{color:#E3C380}
h1 em{font-style:italic;font-weight:500}
.sub{font:500 18px/1.5 Manrope;margin-top:12px;max-width:820px;opacity:.78}
.wm{text-align:right}.wm b{display:block;font:600 34px/1 "Cormorant Garamond";letter-spacing:.32em;margin-right:-.32em}
body.l .wm b{color:#6E1A2B}body.d .wm b{color:#E3C380}
.wm span{display:block;margin-top:8px;font:700 10px/1 Manrope;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(3,390px);gap:44px 30px;margin-top:40px}
figure img{width:390px;height:844px;display:block;border-radius:34px}
body.l figure img{box-shadow:0 0 0 1px rgba(94,26,40,.12),0 30px 60px rgba(84,24,38,.16)}
body.d figure img{box-shadow:0 0 0 1px rgba(227,195,128,.22),0 30px 60px rgba(0,0,0,.55)}
figcaption{margin-top:16px}
figcaption b{display:block;font:600 25px/1.1 "Cormorant Garamond"}
figcaption span{display:block;margin-top:6px;font:500 14.5px/1.5 Manrope;opacity:.72}
</style></head><body>
<div class="top"><div><h1 id="t"></h1><p class="sub" id="s"></p></div><div class="wm"><b>VIA</b><span>bar · by Vladimir &amp; Anastasia</span></div></div>
<div class="grid" id="g"></div>
<script>
const G=[["g-menu","Меню","Приветствие по имени, поиск, вкладки крепости с золотой чертой, коктейли по два в ряд. «В заказ» под каждым; в заказе — счётчик. Полоса заказа над вкладками."],
 ["g-card","Карточка коктейля","Фото во весь верх, шторка цвета страницы: крепость точками, цена, описание, состав чипами. Внизу количество и «Добавить»."],
 ["g-order","Заказ","Позиции со счётчиками, итог, «Отправить заказ». Текущий заказ — вертикальный маршрут «Заказан → Принят → Выдан», прошлые — строками со статусом."],
 ["g-auth","Вход и регистрация","Появляется при первой отправке заказа: «Войти» или «Зарегистрироваться», имя, телефон, PIN — и заказ уходит сразу."],
 ["g-profile","Карта гостя","Бордовая карта с золотой гильоширной сеткой: имя, коктейли и сумма за визит, любимый коктейль. Повтор последнего заказа, история, оценки, выход."],
 ["style","Логотип, палитра, шрифты","Логотип без чёрного круга — линии в цвет темы: бордо днём, золото вечером. Cormorant Garamond для названий, Manrope для текста и кнопок."]];
const B=[["b-orders","Заказы","Карточка на каждого гостя: номер, время, телефон, маршрут, состав. «Принять» и «Отклонить» рядом, у принятых — «Выдать». Вкладки «Гости / Стойка»."],
 ["b-recipes","Рецепты","Книга бара с поиском и вкладками крепости. Цена в строке названия, «Не хватает…» прямо в строке. Заказ за стойкой — плашка над вкладками."],
 ["b-stock","Склад","«Пора докупить» со статусами «Мало / Нет». «В шкафу» — остаток, число бутылок, средняя цена и полоска уровня."],
 ["b-shop","Закупки","Период, сумма за период, покупки по дням: бренд, магазин, цена и цена за мл или грамм."],
 ["b-shift","Статистика и смена","Текущая смена: заказы, коктейли, выручка и «Закрыть смену». Ниже все смены. Прошлые смены на макете — пример."],
 ["b-more","Ещё","Разделы бара и гостей, уведомления с переключателем, безопасность: смена кода, выход здесь или везде."]];
const P={gl:["Гость · <em>день</em>","Светлая тема — слоновая кость, бордо и золото. Фото коктейлей — снимки в бордовом баре, чёткие карточки со скруглёнными углами.",G,"l"],
 gd:["Гость · <em>вечер</em>","Та же разметка в тёмной теме: глубокое бордо, золотые кнопки, те же карточки фото. Тема переключается сама — по настройке телефона.",G,"d"],
 bd:["Бармен · <em>вечер</em>","Панель бармена в вечерней теме: компоновка строже, крупные кнопки действий, статусы цветом.",B,"d"],
 bl:["Бармен · <em>день</em>","Панель бармена в дневной теме — для закупок и учёта при свете.",B,"l"]};
const k=new URLSearchParams(location.search).get("b"),[t,s,list,th]=P[k];
document.body.className=th;document.getElementById("t").innerHTML=t;document.getElementById("s").textContent=s;
document.getElementById("g").innerHTML=list.map(([id,h,d])=>`<figure><img src="shots/${id}-${th}.png"><figcaption><b>${h}</b><span>${d}</span></figcaption></figure>`).join("");
</script></body></html>
