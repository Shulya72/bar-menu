<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial;
overflow-x:hidden;
}

/* ============ UI (оставляем как был) ============ */
.top{
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
z-index:999;
padding:14px;
border-bottom:1px solid #222;
}
.title{text-align:center;font-size:24px;font-weight:700;}
.sum{text-align:center;color:#7CFC00;font-size:22px;margin-top:4px;}

.closeBtn{
width:100%;
padding:14px;
border-radius:14px;
background:#7CFC00;
border:none;
font-size:16px;
font-weight:700;
margin-top:10px;
color:#000;
}

.wrap{max-width:720px;margin:auto;padding:14px;padding-top:210px;}
.card{border:1px solid #333;border-radius:18px;padding:18px;margin-bottom:22px;background:#070707;}
.name{font-size:22px;font-weight:700;margin-bottom:10px;}
.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;}
.btn{width:42px;height:42px;font-size:20px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;}
.count{width:60px;text-align:center;font-size:18px;background:#000;border:1px solid #444;border-radius:10px;color:#fff;height:36px;}

/* ============ OVERLAY ============ */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.96);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.3s;
}
.overlay.show{opacity:1;pointer-events:auto;}

.scene{
width:220px;
height:220px;
position:relative;
}

/* НЕОН */
.neon{
stroke:#7CFC00;
stroke-width:4;
fill:none;
filter:drop-shadow(0 0 8px #7CFC00);
}

/* ШЕЙКЕР */
.shaker{
position:absolute;
right:10px;
top:20px;
transform-origin:center;
}

/* ТРЯСКА */
.shake{
animation:shake .6s infinite;
}
@keyframes shake{
0%{transform:rotate(-6deg);}
50%{transform:rotate(6deg);}
100%{transform:rotate(-6deg);}
}

/* НАКЛОН */
.pour .shaker{
animation:tilt .6s forwards;
}
@keyframes tilt{
to{transform:rotate(65deg) translateX(-40px) translateY(10px);}
}

/* СТРУЯ */
.stream{
stroke:#7CFC00;
stroke-width:4;
opacity:0;
filter:drop-shadow(0 0 6px #7CFC00);
}
.pour .stream{
animation:stream 1s forwards;
}
@keyframes stream{
to{opacity:1;}
}

/* ЖИДКОСТЬ В БОКАЛЕ */
.fill{
fill:#7CFC00;
opacity:.25;
height:0;
}
.pour .fill{
animation:fillup 1s forwards;
}
@keyframes fillup{
to{height:60px;}
}
</style>
</head>

<body>

<div class="top">
<div class="title">Панель бармена PRO</div>
<div class="sum">Сумма: <span id="sum">0</span> ₽</div>
<button class="closeBtn" id="closeBtn">Закрыть смену</button>
</div>

<div class="wrap">
<div id="list"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay">
<div class="scene">

<!-- БОКАЛ -->
<svg width="120" height="160" viewBox="0 0 120 160">
<path class="neon" d="M10 10 H110 V40 C110 70 90 80 60 80 C30 80 10 70 10 40 Z"/>
<line class="neon" x1="60" y1="80" x2="60" y2="130"/>
<line class="neon" x1="30" y1="130" x2="90" y2="130"/>
<rect id="liquid" class="fill" x="15" y="40" width="90" height="0"/>
</svg>

<!-- ШЕЙКЕР -->
<svg class="shaker shake" width="120" height="160" viewBox="0 0 120 160">
<rect class="neon" x="30" y="40" width="60" height="80" rx="20"/>
<rect class="neon" x="20" y="60" width="80" height="20" rx="10"/>
<rect class="neon" x="45" y="10" width="30" height="40" rx="10"/>
</svg>

<!-- СТРУЯ -->
<svg class="stream" width="200" height="200">
<path d="M130 70 C100 80 80 90 60 100"/>
</svg>

</div>
</div>

<script>
const overlay=document.getElementById("overlay");
const shaker=document.querySelector(".shaker");

document.getElementById("closeBtn").onclick=closeShift;

function closeShift(){

overlay.classList.add("show");
shaker.classList.add("shake");

setTimeout(()=>{
/* имитация ответа сервера */
overlay.classList.add("pour");
shaker.classList.remove("shake");

setTimeout(()=>{
overlay.classList.remove("show");
overlay.classList.remove("pour");
shaker.classList.add("shake");
},1500);

},3000);
}
</script>

</body>
</html>
