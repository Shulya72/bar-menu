<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бармен PRO</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

/* overlay */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.96);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.3s;
}
.overlay.show{
opacity:1;
pointer-events:auto;
}

.scene{
width:260px;
height:220px;
position:relative;
}

/* neon */
.neon{
stroke:#7CFC00;
stroke-width:3.5;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
filter:drop-shadow(0 0 6px #7CFC00)
       drop-shadow(0 0 14px #7CFC00);
}

.glowFill{
fill:#7CFC00;
opacity:.18;
filter:drop-shadow(0 0 12px #7CFC00);
}

/* shaker */
.shaker{
position:absolute;
right:10px;
top:10px;
transform-origin:70% 70%;
}

.shake{
animation:shake .5s infinite;
}
@keyframes shake{
0%{transform:rotate(-7deg)}
50%{transform:rotate(7deg)}
100%{transform:rotate(-7deg)}
}

/* pour */
.pour .shaker{
animation:tilt .6s forwards;
}
@keyframes tilt{
to{transform:rotate(65deg) translate(-45px,25px)}
}

/* stream */
.stream{
stroke:#7CFC00;
stroke-width:3.5;
opacity:0;
filter:drop-shadow(0 0 6px #7CFC00);
}
.pour .stream{
animation:flow .8s forwards;
}
@keyframes flow{
to{opacity:1}
}

/* liquid */
.liquid{
fill:#7CFC00;
opacity:.25;
transform-origin:bottom;
transform:scaleY(0);
}
.pour .liquid{
animation:fill .9s forwards;
}
@keyframes fill{
to{transform:scaleY(1)}
}
</style>
</head>

<body>

<button onclick="closeShift()" style="margin:40px;font-size:20px">Закрыть смену</button>

<div id="overlay" class="overlay">
<div class="scene">

<!-- glass -->
<svg width="140" height="180" viewBox="0 0 140 180" style="position:absolute;left:0;bottom:0">
<path class="neon"
d="M20 20 H120 V50
C120 80 95 100 70 100
C45 100 20 80 20 50 Z"/>
<line class="neon" x1="70" y1="100" x2="70" y2="145"/>
<line class="neon" x1="40" y1="145" x2="100" y2="145"/>
<rect class="liquid" x="28" y="50" width="84" height="45" rx="10"/>
</svg>

<!-- shaker -->
<svg id="shaker" class="shaker shake" width="140" height="180" viewBox="0 0 140 180">
<rect class="neon" x="45" y="60" width="50" height="75" rx="25"/>
<rect class="neon" x="35" y="80" width="70" height="22" rx="10"/>
<rect class="neon" x="58" y="20" width="24" height="45" rx="10"/>
</svg>

<!-- stream -->
<svg class="stream" width="260" height="220">
<path d="M150 80 C120 95 100 105 80 120"/>
</svg>

</div>
</div>

<script>
function closeShift(){

const overlay=document.getElementById("overlay");
const shaker=document.getElementById("shaker");

overlay.classList.add("show");
shaker.classList.add("shake");

/* имитация ожидания сервера */
setTimeout(()=>{
shaker.classList.remove("shake");
overlay.classList.add("pour");

/* конец */
setTimeout(()=>{
overlay.classList.remove("show");
overlay.classList.remove("pour");
shaker.classList.add("shake");
},1500);

},3000);

}
</script>

</body>
</html>
